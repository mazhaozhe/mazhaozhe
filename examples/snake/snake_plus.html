<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>贪吃蛇 · 增强版</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: radial-gradient(circle at 50% 0%, #232338 0%, #12121c 70%);
    color: #cdd6f4;
    font-family: "Segoe UI", "Microsoft YaHei", Consolas, sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    overflow: hidden; user-select: none;
  }
  #hud {
    display: flex; gap: 26px; align-items: baseline;
    margin-bottom: 12px; font-size: 14px; letter-spacing: .5px;
    color: #9399b2;
  }
  #hud b { color: #a6e3a1; font-size: 21px; font-variant-numeric: tabular-nums; }
  #hud .combo { color: #f9e2af; }
  #wrap { position: relative; }
  canvas {
    background: #16161f; border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,.6), 0 0 0 1px #2a2a3c inset;
    display: block; touch-action: none;
  }
  #overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(18,18,28,.9); border-radius: 12px;
    text-align: center; padding: 22px; backdrop-filter: blur(3px);
  }
  #overlay.hidden { display: none; }
  #overlay h1 { margin: 0 0 8px; font-size: 27px; color: #f38ba8; letter-spacing: 1px; }
  #overlay p { margin: 3px 0; font-size: 13px; color: #9399b2; line-height: 1.8; }
  #overlay .score { color: #a6e3a1; font-size: 17px; margin: 12px 0 2px; }
  .legend { display: flex; gap: 14px; margin: 12px 0 4px; font-size: 12px; color: #9399b2; flex-wrap: wrap; justify-content: center; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
  .row { display: flex; gap: 8px; margin-top: 14px; }
  button {
    padding: 10px 24px; font-size: 15px; font-family: inherit; cursor: pointer;
    color: #12121c; background: #a6e3a1; border: none;
    border-radius: 8px; font-weight: 700; transition: .15s;
  }
  button:hover { background: #b8f0b3; transform: translateY(-1px); }
  button.ghost {
    background: transparent; color: #9399b2;
    box-shadow: 0 0 0 1px #3a3a52 inset; font-weight: 500;
  }
  button.ghost:hover { color: #cdd6f4; box-shadow: 0 0 0 1px #585b70 inset; }
  button.ghost.on { color: #12121c; background: #89b4fa; box-shadow: none; }
  #tip { margin-top: 12px; font-size: 12px; color: #45475a; }
</style>
</head>
<body>

<div id="hud">
  <span>得分 <b id="score">0</b></span>
  <span>最高 <b id="best">0</b></span>
  <span>速度 <b id="spd" style="color:#89b4fa">1.0x</b></span>
</div>

<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="overlay">
    <h1 id="ovTitle">贪吃蛇 · 增强版</h1>
    <p id="ovDesc">方向键 / WASD 控制 · 空格暂停 · R 重开</p>
    <div class="legend">
      <span><i style="background:#f38ba8"></i>普通 +1</span>
      <span><i style="background:#f9e2af"></i>金色 +3</span>
      <span><i style="background:#cba6f7"></i>减速</span>
      <span><i style="background:#f66151"></i>加速</span>
    </div>
    <div class="score" id="ovScore"></div>
    <div class="row">
      <button id="btn">开始游戏</button>
      <button id="btnWall" class="ghost">穿墙：关</button>
    </div>
  </div>
</div>

<div id="tip">手机端：在棋盘上滑动转向</div>

<script>
(() => {
  // ================= 配置 =================
  const COLS = 22, ROWS = 22;
  const DIFF = {
    easy:   { base: 170, min: 90,  label: '简单' },
    normal: { base: 130, min: 65,  label: '普通' },
    hard:   { base: 95,  min: 50,  label: '困难' }
  };
  let difficulty = 'normal';

  const FOODS = {
    normal: { color: '#f38ba8', score: 1, weight: 70, r: 0.34 },
    gold:   { color: '#f9e2af', score: 3, weight: 14, r: 0.40 },
    slow:   { color: '#cba6f7', score: 1, weight: 8,  r: 0.36 },
    fast:   { color: '#f66151', score: 1, weight: 8,  r: 0.36 }
  };

  // ================= DOM =================
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const $score = document.getElementById('score');
  const $best  = document.getElementById('best');
  const $spd   = document.getElementById('spd');
  const $ov    = document.getElementById('overlay');
  const $ovTitle = document.getElementById('ovTitle');
  const $ovDesc  = document.getElementById('ovDesc');
  const $ovScore = document.getElementById('ovScore');
  const $btn     = document.getElementById('btn');
  const $btnWall = document.getElementById('btnWall');

  // ================= 状态 =================
  let CELL = 24;
  let snake, prevSnake, dir, pending, food, score, best;
  let stepMs, speedMul, state, wrapMode = false;
  let acc = 0, lastT = 0, rafId = null;
  let particles = [];
  let shake = 0;

  best = +(localStorage.getItem('snake2_best') || 0);
  $best.textContent = best;

  const UP = [0,-1], DOWN = [0,1], LEFT = [-1,0], RIGHT = [1,0];

  // ================= 音效（WebAudio 合成，无需音频文件） =================
  let actx = null;
  function beep(freq, dur = 0.08, type = 'sine', vol = 0.06) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (e) { /* 静默失败 */ }
  }

  // ================= 画布自适应 =================
  function fitCanvas() {
    const maxW = Math.min(window.innerWidth - 32, 560);
    const maxH = window.innerHeight - 170;
    CELL = Math.max(10, Math.floor(Math.min(maxW / COLS, maxH / ROWS)));
    const dpr = window.devicePixelRatio || 1;
    cv.width  = COLS * CELL * dpr;
    cv.height = ROWS * CELL * dpr;
    cv.style.width  = COLS * CELL + 'px';
    cv.style.height = ROWS * CELL + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    render(1);
  }

  // ================= 游戏逻辑 =================
  function reset() {
    const cx = COLS >> 1, cy = ROWS >> 1;
    snake = [[cx,cy],[cx-1,cy],[cx-2,cy]];
    prevSnake = snake.map(s => s.slice());
    dir = RIGHT; pending = RIGHT;
    score = 0; speedMul = 1;
    stepMs = DIFF[difficulty].base;
    particles = []; shake = 0;
    food = spawnFood();
    state = 'ready';
    $score.textContent = 0;
    updateSpeedLabel();
    render(1);
  }

  function pickFoodType() {
    const total = Object.values(FOODS).reduce((s, f) => s + f.weight, 0);
    let r = Math.random() * total;
    for (const [k, f] of Object.entries(FOODS)) {
      if ((r -= f.weight) <= 0) return k;
    }
    return 'normal';
  }

  function spawnFood() {
    const empty = [];
    for (let x = 0; x < COLS; x++)
      for (let y = 0; y < ROWS; y++)
        if (!snake.some(s => s[0] === x && s[1] === y)) empty.push([x,y]);
    if (!empty.length) return null;
    const [x, y] = empty[(Math.random() * empty.length) | 0];
    return { x, y, type: pickFoodType(), born: performance.now() };
  }

  function updateSpeedLabel() {
    const mult = DIFF[difficulty].base / stepMs;
    $spd.textContent = mult.toFixed(1) + 'x';
  }

  function start() {
    if (state === 'over' || state === 'ready') reset();
    state = 'running';
    $ov.classList.add('hidden');
    acc = 0; lastT = performance.now();
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  }

  function loop(t) {
    if (state !== 'running') return;
    const dt = Math.min(t - lastT, 100); // 防止切后台后大跳
    lastT = t;
    acc += dt;

    while (acc >= stepMs) {
      acc -= stepMs;
      if (!step()) return; // 游戏结束
    }
    render(acc / stepMs);
    rafId = requestAnimationFrame(loop);
  }

  // 走一步，返回 false 表示游戏结束
  function step() {
    // 禁止 180 度掉头
    if (pending[0] + dir[0] !== 0 || pending[1] + dir[1] !== 0) dir = pending;

    let hx = snake[0][0] + dir[0];
    let hy = snake[0][1] + dir[1];

    // 撞墙
    if (hx < 0 || hx >= COLS || hy < 0 || hy >= ROWS) {
      if (wrapMode) {
        hx = (hx + COLS) % COLS;
        hy = (hy + ROWS) % ROWS;
      } else {
        gameOver(false);
        return false;
      }
    }

    const eating = food && hx === food.x && hy === food.y;
    const body = eating ? snake : snake.slice(0, -1);
    if (body.some(s => s[0] === hx && s[1] === hy)) {
      gameOver(false);
      return false;
    }

    prevSnake = snake.map(s => s.slice());
    snake.unshift([hx, hy]);

    if (eating) {
      const f = FOODS[food.type];
      score += f.score;
      $score.textContent = score;
      burst(food.x, food.y, f.color, food.type === 'gold' ? 26 : 14);
      shake = food.type === 'gold' ? 7 : 4;

      if (food.type === 'gold') beep(880, 0.12, 'triangle', 0.07);
      else if (food.type === 'slow') { speedMul = Math.max(0.6, speedMul - 0.15); beep(330, 0.12, 'sine', 0.06); }
      else if (food.type === 'fast') { speedMul = Math.min(2.2, speedMul + 0.2); beep(660, 0.1, 'square', 0.05); }
      else beep(520, 0.07, 'sine', 0.05);

      // 速度：基础速度随分数缓慢提升，再乘上食物带来的倍率
      const d = DIFF[difficulty];
      const baseStep = Math.max(d.min, d.base - Math.floor(score / 4) * 4);
      stepMs = Math.max(d.min * 0.7, baseStep / speedMul);
      updateSpeedLabel();

      food = spawnFood();
      if (!food) { render(1); gameOver(true); return false; }
    } else {
      snake.pop();
    }
    return true;
  }

  function gameOver(win) {
    state = 'over';
    if (rafId) cancelAnimationFrame(rafId);
    if (score > best) {
      best = score;
      localStorage.setItem('snake2_best', best);
      $best.textContent = best;
    }
    if (!win) { beep(180, 0.3, 'sawtooth', 0.07); shake = 10; }
    else beep(1046, 0.4, 'triangle', 0.08);

    $ovTitle.textContent = win ? '通关！' : '游戏结束';
    $ovDesc.innerHTML = win
      ? '整个棋盘都被你填满了 🎉'
      : '方向键 / WASD 控制 · 空格暂停 · R 重开';
    $ovScore.textContent = `本局得分 ${score} · 最高分 ${best}`;
    $btn.textContent = '再来一局';
    $ov.classList.remove('hidden');
    render(1);
  }

  function togglePause() {
    if (state === 'running') {
      state = 'paused';
      if (rafId) cancelAnimationFrame(rafId);
      $ovTitle.textContent = '已暂停';
      $ovDesc.textContent = '按空格继续';
      $ovScore.textContent = '';
      $btn.textContent = '继续';
      $ov.classList.remove('hidden');
    } else if (state === 'paused') {
      state = 'running';
      $ov.classList.add('hidden');
      lastT = performance.now(); acc = 0;
      rafId = requestAnimationFrame(loop);
    }
  }

  // ================= 粒子 =================
  function burst(gx, gy, color, n) {
    const cx = (gx + 0.5) * CELL, cy = (gy + 0.5) * CELL;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 0.6 + Math.random() * 2.4;
      particles.push({
        x: cx, y: cy,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 1, color,
        size: 1.5 + Math.random() * 2.5
      });
    }
  }

  function updateParticles(dt) {
    const k = dt / 16.67;
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * k;
      p.y += p.vy * k;
      p.vy += 0.06 * k;
      p.vx *= 0.97;
      p.life -= 0.022 * k;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  // ================= 渲染 =================
  let lastRenderT = 0;
  function render(progress) {
    const now = performance.now();
    const dt = lastRenderT ? Math.min(now - lastRenderT, 50) : 16;
    lastRenderT = now;

    updateParticles(dt);
    if (shake > 0) shake = Math.max(0, shake - 0.6);

    const W = COLS * CELL, H = ROWS * CELL;
    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }
    ctx.clearRect(-20, -20, W + 40, H + 40);

    // 背景网格
    ctx.strokeStyle = '#20202e';
    ctx.lineWidth = 1;
    for (let x = 0; x <= COLS; x++) {
      ctx.beginPath(); ctx.moveTo(x*CELL, 0); ctx.lineTo(x*CELL, H); ctx.stroke();
    }
    for (let y = 0; y <= ROWS; y++) {
      ctx.beginPath(); ctx.moveTo(0, y*CELL); ctx.lineTo(W, y*CELL); ctx.stroke();
    }

    // 食物（带呼吸光晕）
    if (food) {
      const f = FOODS[food.type];
      const pulse = 1 + Math.sin(now / 220) * 0.12;
      const cx = (food.x + 0.5) * CELL, cy = (food.y + 0.5) * CELL;
      const r = CELL * f.r * pulse;

      const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 2.4);
      glow.addColorStop(0, f.color + 'aa');
      glow.addColorStop(1, f.color + '00');
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(cx, cy, r * 2.4, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = f.color;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();

      // 金色食物加个星形高光
      if (food.type === 'gold') {
        ctx.fillStyle = '#fff8dc';
        ctx.beginPath(); ctx.arc(cx - r*0.3, cy - r*0.3, r*0.28, 0, Math.PI * 2); ctx.fill();
      }
    }

    // 蛇（平滑插值）
    const n = snake.length;
    for (let i = n - 1; i >= 0; i--) {
      const cur = snake[i];
      const prev = prevSnake[i] || cur;
      let px = prev[0], py = prev[1];

      // 穿墙时距离过大 → 不插值，直接跳
      if (Math.abs(cur[0] - px) > 1 || Math.abs(cur[1] - py) > 1) {
        px = cur[0]; py = cur[1];
      }

      const ix = px + (cur[0] - px) * progress;
      const iy = py + (cur[1] - py) * progress;

      const t = i / Math.max(1, n - 1);
      const pad = Math.max(1, CELL * 0.07);
      const size = CELL - pad * 2;

      if (i === 0) {
        ctx.fillStyle = '#a6e3a1';
        ctx.shadowColor = '#a6e3a1';
        ctx.shadowBlur = CELL * 0.6;
      } else {
        // 身体渐变：靠近头部亮，尾部暗
        const g = Math.round(199 - t * 60);
        ctx.fillStyle = `rgb(${Math.round(116 - t*30)}, ${g}, ${Math.round(161 - t*40)})`;
        ctx.shadowBlur = 0;
      }

      roundRect(ix*CELL + pad, iy*CELL + pad, size, size, Math.max(2, CELL*0.22));
      ctx.fill();
      ctx.shadowBlur = 0;

      // 眼睛
      if (i === 0) {
        ctx.fillStyle = '#12121c';
        const ex = ix*CELL + CELL/2, ey = iy*CELL + CELL/2;
        const off = CELL * 0.16;
        const dx = dir[0] * off * 0.6, dy = dir[1] * off * 0.6;
        const perpX = dir[1] * off, perpY = dir[0] * off;
        const er = Math.max(1.2, CELL * 0.09);
        ctx.beginPath(); ctx.arc(ex + dx + perpX, ey + dy + perpY, er, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(ex + dx - perpX, ey + dy - perpY, er, 0, Math.PI*2); ctx.fill();
      }
    }

    // 粒子
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y,   x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x,   y+h, r);
    ctx.arcTo(x,   y+h, x,   y,   r);
    ctx.arcTo(x,   y,   x+w, y,   r);
    ctx.closePath();
  }

  // ================= 输入 =================
  const keyMap = {
    arrowup: UP, w: UP, arrowdown: DOWN, s: DOWN,
    arrowleft: LEFT, a: LEFT, arrowright: RIGHT, d: RIGHT
  };

  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k in keyMap) {
      e.preventDefault();
      pending = keyMap[k];
      if (state === 'ready') start();
    } else if (k === ' ') {
      e.preventDefault();
      if (state === 'ready' || state === 'over') start();
      else togglePause();
    } else if (k === 'r') {
      reset(); start();
    }
  });

  // 触屏滑动
  let tx = 0, ty = 0;
  cv.addEventListener('touchstart', e => {
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, { passive: true });

  cv.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tx;
    const dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return;
    pending = Math.abs(dx) > Math.abs(dy)
      ? (dx > 0 ? RIGHT : LEFT)
      : (dy > 0 ? DOWN : UP);
    if (state === 'ready') start();
  }, { passive: true });

  $btn.addEventListener('click', () => {
    if (state === 'paused') togglePause();
    else start();
  });

  $btnWall.addEventListener('click', () => {
    wrapMode = !wrapMode;
    $btnWall.textContent = '穿墙：' + (wrapMode ? '开' : '关');
    $btnWall.classList.toggle('on', wrapMode);
  });

  window.addEventListener('resize', fitCanvas);

  // ================= 启动 =================
  reset();
  fitCanvas();
})();
</script>
</body>
</html>
